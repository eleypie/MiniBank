<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBank - Transfer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="mobile-card">

    <div class="header">
        <a class="back-link" th:href="@{/dashboard}"><i class="fas fa-arrow-left"></i></a>
        <div class="brand">
            <span class="brand-icon">✦</span>
            <span class="brand-name">Mini<span>Bank</span></span>
        </div>
        <div class="welcome">
            <div class="welcome-label">Welcome back</div>
            <div class="welcome-name" th:text="${userName}">User</div>
        </div>
    </div>

    <div class="transaction-card">
        <div class="transaction-title"><i class="fas fa-paper-plane" style="margin-right: 8px;"></i>Transfer Money</div>

        <form th:action="@{/transfer}" method="post">

            <div class="recipient-group">
                <label class="recipient-label" for="recipientNumber">Recipient Mobile Number</label>
                <input type="text" id="recipientNumber" name="recipientNumber"
                       class="recipient-input" placeholder="09XXXXXXXXX"
                       th:value="${recipientNumber}">
            </div>

            <input type="number" step="0.01" min="0" name="amount"
                   class="amount-input" placeholder="₱0.00"
                   th:value="${amount}">

            <!-- Error message -->
            <p class="field-hint" th:classappend="${errorMessage != null} ? 'error' : ''">
                <span th:if="${errorMessage != null}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:text="${errorMessage}"></span>
                </span>
                <span th:unless="${errorMessage != null}">
                    Enter amount to send
                </span>
            </p>

            <div class="confirm-row">
                <button type="submit" class="confirm-btn">
                    <i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Send Money
                </button>
            </div>
        </form>

        <div class="available-balance">
            Available Balance: <span th:text="${balance}">100,000.00</span>
        </div>
    </div>

    <!-- Result Card -->
    <div class="result-card" th:if="${transferSuccess} != null">
        <div class="result-status" th:classappend="${transferSuccess} ? '' : 'failed'"
             th:text="${transferSuccess} ? '✅ Transfer Successful!' : '❌ Transfer Failed'">
            Transfer Successful!
        </div>
        <hr class="result-divider">
        <div class="result-row" th:if="${transferSuccess}">
            <span class="label">Sent To</span>
            <span class="value" th:text="${recipientName} + ' (' + ${recipientNumber} + ')'">John Doe (09171234567)</span>
        </div>
        <div class="result-row">
            <span class="label">Old Balance</span>
            <span class="value" th:text="'₱' + ${oldBalance}">₱0.00</span>
        </div>
        <div class="result-row">
            <span class="label">Amount Sent</span>
            <span class="value" th:text="'₱' + ${amount}">₱0.00</span>
        </div>
        <div class="result-row">
            <span class="label">New Balance</span>
            <span class="value" th:text="'₱' + ${newBalance}">₱0.00</span>
        </div>
        <hr class="result-divider">
        <div class="result-row" th:if="${transferSuccess}">
            <span class="label">Status</span>
            <span class="value" style="color: #48cae4;">✓ Completed</span>
        </div>
    </div>

</div>

</body>
</html>
