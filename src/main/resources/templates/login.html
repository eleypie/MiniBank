<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MiniBank Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=1.1)}">
</head>
<body>

<div class="mobile-card">
    <div class="logo-box">
        <div class="logo-badge">Mini<span>Bank</span></div>
    </div>

    <p th:if="${error}" th:text="${error}" style="color: #ffdddd; font-size: 12px; text-align: center; margin-bottom: 15px; font-weight: bold; "></p>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Enter mobile number</label>
            <input type="text" name="mobileNumber" class="input-field" placeholder="09XX XXX XXXX" required>
        </div>

        <div class="form-group">
            <label>Enter PIN</label>
            <input type="password" name="pin" class="input-field" placeholder="****" maxlength="4" required>
        </div>

        <button type="submit" class="submit-btn">User Login</button>
    </form>
</div>

</body>
</html>
