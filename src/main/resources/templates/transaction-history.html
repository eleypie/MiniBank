<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MiniBank - Transaction History</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="mobile-card">

    <div class="header">
        <a class="back-link" th:href="@{/dashboard}">&larr;</a>
        <div class="brand">Mini<span>Bank</span></div>
        <div class="welcome">
            <div class="welcome-label">Welcome back</div>
            <div class="welcome-name" th:text="${userName}">User</div>
        </div>
    </div>

    <div class="filter-row">
        <a class="filter-chip" th:classappend="${filter} == 'ALL' ? 'active' : ''"
           th:href="@{/transactions(filter='ALL')}">All</a>
        <a class="filter-chip" th:classappend="${filter} == 'DEPOSIT' ? 'active' : ''"
           th:href="@{/transactions(filter='DEPOSIT')}">Deposit</a>
        <a class="filter-chip" th:classappend="${filter} == 'WITHDRAW' ? 'active' : ''"
           th:href="@{/transactions(filter='WITHDRAW')}">Withdraw</a>
        <a class="filter-chip" th:classappend="${filter} == 'TRANSFER' ? 'active' : ''"
           th:href="@{/transactions(filter='TRANSFER')}">Transfer</a>
    </div>

    <div class="history-list">

        <div th:each="txn : ${transactions}" class="history-item">
            <div class="history-item-left">
                <span class="history-type"
                      th:classappend="${txn.type == 'DEPOSIT'} ? 'deposit' : (${txn.type == 'WITHDRAW'} ? 'withdraw' : 'transfer')"
                      th:text="${txn.type}">DEPOSIT</span>
                <span class="history-date" th:text="${txn.dateFormatted}">Aug 29, 2026 - 9:41 AM</span>
            </div>
            <div class="history-item-right">
                <div class="history-amount"
                     th:classappend="${txn.type == 'WITHDRAW' or txn.type == 'TRANSFER'} ? 'negative' : 'positive'"
                     th:text="(${txn.type == 'WITHDRAW' or txn.type == 'TRANSFER'} ? '- ₱' : '+ ₱') + ${txn.amountFormatted}">
                    + ₱0.00
                </div>
                <div class="history-balance" th:text="'Balance: ₱' + ${txn.balanceAfterFormatted}">Balance: ₱0.00</div>
            </div>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(transactions)}">
            No transactions yet.
        </div>

    </div>

</div>

</body>
</html>
