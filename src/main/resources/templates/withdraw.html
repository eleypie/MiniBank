<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MiniBank - Withdraw</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="mobile-card">

    <div class="header">
        <a class="back-link" th:href="@{/dashboard}">&larr;</a>
        <div class="brand">Mini<span>Bank</span></div>
        <div class="welcome">
            <div class="welcome-label">Welcome back</div>
            <div class="welcome-name" th:text="${userName}">User</div>
        </div>
    </div>

    <div class="transaction-card">
        <div class="transaction-title">Withdraw Money</div>

        <form th:action="@{/withdraw}" method="post">
            <input type="number" step="0.01" min="0" name="amount"
                   class="amount-input" placeholder="₱0.00"
                   th:value="${amount}">

            <p class="field-hint" th:classappend="${errorMessage} != null ? 'error' : ''"
               th:text="${errorMessage} != null ? ${errorMessage} : 'Enter valid amount'">
                Enter valid amount
            </p>

            <div class="confirm-row">
                <button type="submit" class="confirm-btn">Confirm</button>
            </div>
        </form>

        <div class="available-balance">
            Available Balance: <span th:text="${balance}">100,000.00</span>
        </div>
    </div>

    <div class="result-card" th:if="${withdrawSuccess} != null">
        <div class="result-status" th:classappend="${withdrawSuccess} ? '' : 'failed'"
             th:text="${withdrawSuccess} ? 'Withdraw Successful!' : 'Withdraw Failed'">
            Withdraw Successful!
        </div>
        <hr class="result-divider">
        <div class="result-row">
            <span class="label">Old Balance</span>
            <span class="value" th:text="'₱' + ${oldBalance}">₱0.00</span>
        </div>
        <div class="result-row">
            <span class="label">New Balance</span>
            <span class="value" th:text="'₱' + ${newBalance}">₱0.00</span>
        </div>
        <hr class="result-divider">
    </div>

</div>

</body>
</html>
