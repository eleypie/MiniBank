<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBank Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="mobile-card">

    <!-- Header with Logout -->
    <div class="header">
        <a class="logout-link" th:href="@{/logout}" title="Logout">
            <i class="fas fa-power-off"></i>
        </a>
        <div class="brand">
            <span class="brand-icon">✦</span>
            <span class="brand-name">Mini<span>Bank</span></span>
        </div>
        <div class="welcome">
            <div class="welcome-label">Welcome back</div>
            <div class="welcome-name" th:text="${userName}">User</div>
        </div>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
        <div class="balance-title">Current Balance</div>
        <div class="balance-amount">₱<span th:text="${balance}">0.00</span></div>
        <div class="account-number">Mobile No. <span th:text="${mobileNumber}">00000000000</span></div>
    </div>

    <!-- Menu Options -->
    <div class="menu-options">
        <button class="menu-btn" onclick="window.location.href='/deposit'">
            <span class="btn-icon">💰</span> DEPOSIT
        </button>

        <button class="menu-btn" onclick="window.location.href='/withdraw'">
            <span class="btn-icon">🏦</span> WITHDRAW
        </button>

        <button class="menu-btn" onclick="window.location.href='/transfer'">
            <span class="btn-icon">📤</span> TRANSFER
        </button>

        <button class="menu-btn" onclick="window.location.href='/transactions'">
            <span class="btn-icon">📊</span> TRANSACTION HISTORY
        </button>
    </div>
</div>

</body>
</html>
